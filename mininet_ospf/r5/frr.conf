frr version 9.1
frr defaults traditional
hostname r5
log syslog informational
service integrated-vtysh-config
!
ip forwarding
no ipv6 forwarding
!
router ospf
#  ospf router-id 10.7.0.1
#  network 10.7.0.0/24 area 0.0.0.0
#  network 10.8.0.0/24 area 0.0.0.0
#  network 10.102.0.0/24 area 0.0.0.0
#  network 10.103.0.0/24 area 0.0.0.0
 ospf router-id 1.1.1.5
 network 10.0.45.0/24 area 0.0.0.0
 network 10.0.56.0/24 area 0.0.0.0
!
line vty
# exit
!
