frr version 9.1
frr defaults traditional
hostname r2
log syslog informational
service integrated-vtysh-config
!
ip forwarding
no ipv6 forwarding
!
router ospf
#  ospf router-id 10.3.0.1
#  network 10.3.0.0/24 area 0.0.0.0
#  network 10.4.0.0/24 area 0.0.0.0
#  network 10.100.0.0/24 area 0.0.0.0
#  network 10.101.0.0/24 area 0.0.0.0
router ospf
 ospf router-id 1.1.1.2
 network 10.0.12.0/24 area 0.0.0.0
 network 10.0.23.0/24 area 0.0.0.0
!
line vty
# exit
!
