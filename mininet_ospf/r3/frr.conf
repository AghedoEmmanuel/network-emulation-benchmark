# service integrated-vtysh-config
frr version 9.1
frr defaults traditional
hostname r3
log syslog informational
service integrated-vtysh-config
!
ip forwarding
no ipv6 forwarding
!
router ospf
#  ospf router-id 10.5.0.1
#  network 10.5.0.0/24 area 0.0.0.0
#  network 10.6.0.0/24 area 0.0.0.0
#  network 10.101.0.0/24 area 0.0.0.0
#  network 10.102.0.0/24 area 0.0.0.0
 ospf router-id 1.1.1.3
 network 10.0.23.0/24 area 0.0.0.0
 network 10.0.34.0/24 area 0.0.0.0
!
line vty
# exit
!
