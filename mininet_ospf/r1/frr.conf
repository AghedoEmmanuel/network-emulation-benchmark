frr version 9.1
frr defaults traditional
hostname r1
log syslog informational
service integrated-vtysh-config
!
ip forwarding
no ipv6 forwarding
!
router ospf
 ospf router-id 1.1.1.1
 network 10.0.12.0/24 area 0.0.0.0
 network 10.0.61.0/24 area 0.0.0.0
!
line vty

!
