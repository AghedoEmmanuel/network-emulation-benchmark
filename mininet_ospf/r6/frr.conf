# frr version 9.1-MyOwnFRRVersion
# frr defaults traditional
# hostname vm-r6
# log syslog informational
# ip forwarding
# no ipv6 forwarding
# service integrated-vtysh-config
frr version 9.1
frr defaults traditional
hostname r6
log syslog informational
service integrated-vtysh-config
!
ip forwarding
no ipv6 forwarding
!
interface lo
  ip address 6.6.6.6/32
!
router ospf

 ospf router-id 6.6.6.6
 network 6.6.6.6/32 area 0.0.0.0
 network 10.0.56.0/24 area 0.0.0.0
 network 10.0.61.0/24 area 0.0.0.0
!
line vty
exit
!
