# ============================================================
# PART 3 CONFIG SNIPPET: sr1_bird_mininet_static.conf
#
# Paste this into /etc/bird/bird.conf inside SR1, before the
# protocol ospf section.
#
# Purpose:
#   Tell SR1 that the Mininet network and bridge network are
#   reachable through the SEED gateway.
# ============================================================

protocol static mininet_static {
    ipv4;

    route 10.1.0.0/16 via 10.0.200.253;
    route 172.16.100.0/30 via 10.0.200.253;
}

# Then, inside the existing protocol ospf section, make sure
# static routes are exported into OSPF:
#
# ipv4 {
#     import all;
#     export where source = RTS_STATIC;
# };
#
# Do not duplicate export lines.
# Replace the old export line carefully.