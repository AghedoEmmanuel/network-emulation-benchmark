# frr version 9.1-MyOwnFRRVersion
# frr defaults traditional
# hostname vm-r1
# log syslog informational
# ip forwarding
# no ipv6 forwarding
# service integrated-vtysh-config
frr version 9.1
frr defaults traditional
hostname r1
log syslog informational
service integrated-vtysh-config
!
ip forwarding
no ipv6 forwarding
!
interface lo
  ip address 1.1.1.1/32
!
#ip route 10.0.0.0/16 192.168.5.247

router ospf
 ospf router-id 1.1.1.1
 network 1.1.1.1/32 area 0.0.0.0
 network 10.1.12.0/24 area 0.0.0.0
 network 10.1.61.0/24 area 0.0.0.0
!
line vty
exit

!
